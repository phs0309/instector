5. 화공, 에너지, 섬유 및 기타
화공/세라믹: 화공기술사

에너지: 원자력발전기술사, 방사선관리기술사

농림/수산: 산림기술사, 종자기술사, 시설원예기술사, 수산제조기술사, 해양기술사

