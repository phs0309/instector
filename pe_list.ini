안전: 소방기술사, 건설안전기술사, 기계안전기술사, 전기안전기술사, 화공안전기술사, 가스기술사, 인간공학기술사

환경: 수질관리기술사, 대기관리기술사, 소음진동기술사, 폐기물처리기술사, 자연환경관리기술사, 토양환경기술사

비파괴: 비파괴검사기술사

3. 기계 및 금속
제조업 및 플랜트 산업의 핵심 자격입니다.

기계: 기계기술사, 공조냉동기계기술사, 건설기계기술사, 산업기계설비기술사, 금형기술사

자동차/항공/조선: 차량기술사, 항공기관기술사, 항공기체기술사, 조선기술사

금속/재료: 금속제련기술사, 금속재료기술사, 표면처리기술사, 세라믹기술사

4. 전기, 전자 및 정보통신
4차 산업혁명 및 전력 인프라와 관련된 핵심 분야입니다.

전기: 발송배전기술사, 건축전기설비기술사, 전기응용기술사, 철도신호기술사

