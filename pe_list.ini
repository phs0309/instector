1. 건설 및 건축 (가장 많은 종목 보유)
이 분야는 세분화가 많이 되어 있으며, 응시 인원도 가장 많은 편입니다.

건축 분야: 건축구조기술사, 건축기계설비기술사, 건축시공기술사, 건축전기설비기술사, 건축품질시험기술사

토목 분야: 토목시공기술사, 토질및기초기술사, 토목구조기술사, 도로및공항기술사, 상하수도기술사, 수자원개발기술사, 지적기술사, 측량및지형공간정보기술사, 항만및해안기술사, 철도기술사, 농어업토목기술사

도시 및 교통: 도시계획기술사, 조경기술사, 교통기술사

2. 안전관리 및 환경
